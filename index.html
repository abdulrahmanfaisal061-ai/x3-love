<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>٦ مفاجآت ليكي 🌸</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg1:#fff1f6;--bg2:#ffd3e4;--txt:#7a2a4d;--glass:rgba(255,255,255,.65);--acc:#e8578f;--line:#f3a6c4;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#2a0f1c;--bg2:#4a1730;--txt:#ffe3ee;--glass:rgba(255,255,255,.1);--line:#a54a73}}
:root[data-theme="dark"]{--bg1:#2a0f1c;--bg2:#4a1730;--txt:#ffe3ee;--glass:rgba(255,255,255,.1);--line:#a54a73}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg1);color:var(--txt);font-family:Cairo,Tahoma,Arial,sans-serif;overflow:hidden;text-align:center}
#app{position:fixed;inset:0;max-width:480px;margin:auto;background:linear-gradient(170deg,var(--bg1),var(--bg2));overflow:hidden}
.sc{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px));z-index:2}
.sc.on{display:flex;animation:fi .8s both}
@keyframes fi{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
h1{margin:0;font-size:clamp(30px,9vw,46px);font-weight:900;line-height:1.4}
p{margin:0;font-size:18px;line-height:1.8;opacity:.85}
button{font-family:inherit;font-size:20px;font-weight:900;border:0;border-radius:50px;padding:13px 34px;background:var(--acc);color:#fff;cursor:pointer;box-shadow:0 8px 26px rgba(232,87,143,.45)}
button:active{transform:scale(.94)}
#dots{display:flex;gap:8px}
#dots i{width:11px;height:11px;border-radius:50%;background:var(--line)}
#dots i.d{background:var(--acc);transform:scale(1.2)}
#card{position:relative;width:min(86vw,360px);aspect-ratio:3/4;max-height:58vh;border-radius:26px;overflow:hidden;background:var(--glass);border:5px solid #fff;box-shadow:0 14px 44px rgba(232,87,143,.35)}
#card img,#cv{position:absolute;inset:0;width:100%;height:100%}
#card img{object-fit:cover}
#cv{touch-action:none;cursor:grab;transition:opacity 1.1s}
#cv{animation:sh 2.4s ease-in-out infinite}@keyframes sh{50%{filter:brightness(1.1) saturate(1.15)}}
#pol{display:flex;justify-content:center;margin-bottom:6px}
#pol img,.gp img{background:#fff;padding:6px 6px 22px;border-radius:4px;box-shadow:0 8px 24px rgba(122,42,77,.35);object-fit:cover}
#pol img{width:92px;height:122px;margin:0 -10px}
#gal{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:min(92vw,420px)}
.gp img{width:100%;aspect-ratio:3/4;display:block;animation:fi .8s both}
#cap{min-height:34px;font-size:22px;font-weight:700;opacity:0;transition:opacity 1s}
.pet{position:absolute;top:-30px;pointer-events:none;z-index:1;animation:fall linear infinite}
@keyframes fall{to{transform:translateY(110vh) rotate(300deg)}}
.sp{position:fixed;pointer-events:none;z-index:9;font-size:26px;animation:sp 1.2s forwards}
@keyframes sp{to{transform:translate(var(--x),var(--y)) scale(.4);opacity:0}}
#no{background:#a98;box-shadow:none}
.f{position:fixed;bottom:-50px;pointer-events:none;z-index:9;animation:up linear forwards}
@keyframes up{to{transform:translateY(-120vh) rotate(40deg);opacity:0}}
</style>
</head>
<body>
<div id="app">
 <div class="sc on" id="s0"><div id="pol"></div><h1>٦ مفاجآت ليكي 🌸</h1><p>اخدشي كل كارت بإصبعك<br>وشوفي إيه مستخبي جواه 💗</p><button id="go">يلا نبدأ ✨</button></div>
 <div class="sc" id="s1"><div id="dots"></div><div id="card"><img id="im" alt=""><canvas id="cv" width="360" height="480"></canvas></div><div id="cap"></div><button id="nx" style="display:none"></button></div>
 <div class="sc" id="s2"><h1 id="q">آخر مفاجأة…<br>تفضلي معايا للأبد؟ 💍</h1><button id="yes">أيوه طبعاً 💖</button><button id="no">لأ 😒</button></div>
 <div class="sc" id="s3"><h1 id="fin"></h1><div id="gal"></div><p>— عبدالرحمن 🌹</p></div>
</div>

const $=s=>document.querySelector(s),app=$('#app');
[0,2,5].forEach((n,i)=>{const e=document.createElement('img');e.src=PHOTOS[n];e.style.transform=`rotate(${(i-1)*9}deg)`;$('#pol').appendChild(e)});
const SC=[{p:0,c:"ضحكتك بتنوّر يومي 😊"},{p:1,c:"قربك أحلى حاجة 🥹"},{p:2,c:"كل لحظة معاكي حلوة 😘"},{p:3,c:"إيدي في إيدك وأمان الدنيا 🤍"},{p:4,c:"والحكاية لسه بتبدأ 💍"},{p:5,c:"أنا وانتي… وبس ❤️"}];
function go(id){document.querySelectorAll('.sc').forEach(e=>e.classList.remove('on'));$(id).classList.add('on')}
// petals
for(let i=0;i<14;i++){const e=document.createElement('div');e.className='pet';e.textContent=['🌸','💮','🌷'][i%3];e.style.left=Math.random()*100+'%';e.style.fontSize=14+Math.random()*14+'px';e.style.opacity=.55;e.style.animationDuration=9+Math.random()*8+'s';e.style.animationDelay=-Math.random()*14+'s';app.appendChild(e)}
// audio
let AC,M,mi=0;const CH=[[60,64,67],[55,59,62],[57,60,64],[52,55,59],[53,57,60],[60,64,67],[53,57,60],[55,59,62]],hz=m=>440*2**((m-69)/12);
function tn(m,d,v,type='sine'){if(!AC)return;const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime+.02;o.type=type;o.frequency.value=hz(m);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(M);o.start(t);o.stop(t+d+.1)}
function music(){AC=new(window.AudioContext||window.webkitAudioContext)();M=AC.createGain();M.gain.value=1;M.connect(AC.destination);setInterval(()=>{const c=CH[(mi>>3)%8];tn(c[[0,1,2,1,2,1,2,1][mi&7]]+12,1.5,.06,'triangle');if(!(mi&7))tn(c[0]-12,2.5,.08);mi++},340)}
const PENT=[84,86,88,91,93,96];
function chime(){[72,76,79,84,88].forEach((m,i)=>setTimeout(()=>tn(m,2,.2),i*110))}
function sparkle(x,y,n=12){for(let i=0;i<n;i++){const e=document.createElement('div');e.className='sp';e.textContent=['✨','💗','🌸'][i%3];e.style.left=x+'px';e.style.top=y+'px';e.style.setProperty('--x',(Math.random()-.5)*220+'px');e.style.setProperty('--y',(Math.random()-.9)*220+'px');document.body.appendChild(e);setTimeout(()=>e.remove(),1300)}}
function rain(n){for(let k=0;k<n;k++)setTimeout(()=>{const e=document.createElement('div');e.className='f';e.textContent=['💖','💗','💍','✨','🌹','🌸'][Math.random()*6|0];e.style.left=Math.random()*100+'%';e.style.fontSize=20+Math.random()*30+'px';e.style.animationDuration=4+Math.random()*3+'s';document.body.appendChild(e);setTimeout(()=>e.remove(),7500)},k*110)}
// scratch cards
const cv=$('#cv'),cx=cv.getContext('2d'),im=$('#im'),cap=$('#cap'),nx=$('#nx');let k=0,drawing=false,done=false,last=null,mv=0;
$('#dots').innerHTML=SC.map(()=>'<i></i>').join('');
function foil(){cx.globalCompositeOperation='source-over';const g=cx.createLinearGradient(0,0,360,480);g.addColorStop(0,'#f8c1d8');g.addColorStop(.35,'#fde4ee');g.addColorStop(.65,'#e9a3c2');g.addColorStop(1,'#fbd0e2');cx.fillStyle=g;cx.fillRect(0,0,360,480);
 for(let i=0;i<150;i++){cx.fillStyle=`rgba(255,255,255,${Math.random()*.7})`;cx.beginPath();cx.arc(Math.random()*360,Math.random()*480,Math.random()*2.5+.5,0,7);cx.fill()}
 cx.fillStyle='rgba(122,42,77,.75)';cx.font='900 34px Cairo,Tahoma,sans-serif';cx.textAlign='center';cx.fillText('اخدشي هنا',180,225);cx.font='60px sans-serif';cx.fillText('💗',180,300)}
function load(){const s=SC[k];done=false;im.src=PHOTOS[s.p];cap.style.opacity=0;cap.textContent=s.c;nx.style.display='none';cv.style.transition='none';cv.style.opacity=1;foil();[...$('#dots').children].forEach((d,i)=>d.className=i<k?'d':'')}
function pos(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*360/r.width,y:(e.clientY-r.top)*480/r.height}}
function pct(){const d=cx.getImageData(0,0,360,480).data;let c=0,t=0;for(let y=0;y<480;y+=12)for(let x=0;x<360;x+=12){t++;if(d[(y*360+x)*4+3]<40)c++}return c/t}
function reveal(){done=true;cv.style.transition='opacity 1.1s';cv.style.opacity=0;cap.style.opacity=1;chime();const r=cv.getBoundingClientRect();sparkle(r.left+r.width/2,r.top+r.height/2,18);
 [...$('#dots').children].forEach((d,i)=>d.className=i<=k?'d':'');
 nx.textContent=k<SC.length-1?'الكارت اللي بعده 🎁':'افتحي المفاجأة الأخيرة 💌';nx.style.display='block'}
cv.addEventListener('pointerdown',e=>{if(done)return;drawing=true;last=pos(e);cv.setPointerCapture(e.pointerId)});
cv.addEventListener('pointermove',e=>{if(!drawing||done)return;const p=pos(e);cx.globalCompositeOperation='destination-out';cx.lineWidth=46;cx.lineCap='round';cx.beginPath();cx.moveTo(last.x,last.y);cx.lineTo(p.x,p.y);cx.stroke();last=p;
 if(++mv%6===0){tn(PENT[Math.random()*6|0],.5,.07)}if(mv%5===0)sparkle(e.clientX,e.clientY,1);if(mv%10===0&&pct()>.5)reveal()});
['pointerup','pointercancel'].forEach(v=>cv.addEventListener(v,()=>{drawing=false;if(!done&&pct()>.5)reveal()}));
nx.onclick=()=>{k++;if(k<SC.length)load();else{go('#s2');question()}};
$('#go').onclick=()=>{music();go('#s1');load()};
function question(){let d=0;const no=$('#no'),yes=$('#yes'),L=["متأكدة؟ 🥺","فكري تاني 😢","لأ بجد؟ 💔","جربي الزر التاني 😏"];
 const run=e=>{e.preventDefault();d++;no.style.position='fixed';no.style.zIndex=20;no.style.left=Math.random()*(innerWidth-110)+'px';no.style.top=Math.random()*(innerHeight-60)+'px';yes.style.fontSize=20+d*5+'px';$('#q').innerHTML=L[d%4];tn(55,.4,.2,'sawtooth')};
 ['mouseenter','touchstart','click'].forEach(v=>no.addEventListener(v,run));
 yes.onclick=()=>{no.remove();go('#s3');$('#fin').innerHTML=`بحبك يا ${NAME}<br>للأبد ❤️`;$('#gal').innerHTML=PHOTOS.map((u,i)=>`<div class="gp"><img src="${u}" style="transform:rotate(${(i%2?1:-1)*(2+i)}deg);animation-delay:${i*.25}s"></div>`).join('');chime();setTimeout(chime,900);rain(90)}}
</script>
</body>
